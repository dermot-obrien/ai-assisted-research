name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  skills:
    name: Agent Skills validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # AAR's tooling is Python; the validator is zero-dependency so this job
      # needs no install step of its own.
      - name: Validate skills against the agentskills.io spec
        run: node tools/validate-skills.mjs skills

  install:
    name: Install into a scratch workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: aar

      # AAR installs through the shared AAW engine, so CI needs both clones.
      - uses: actions/checkout@v4
        with:
          repository: dermot-obrien/ai-assisted-work
          path: aaw

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # AAR declares `depends: [aaw]`, so AAW must be installed into the target
      # workspace first. Otherwise the dependency check warns, and a warning is a
      # non-zero exit even though the install itself succeeded. This is also the
      # order a real user installs them in.
      - name: Install AAW, then AAR
        run: |
          mkdir -p /tmp/ws/.claude && cd /tmp/ws && git init -q .
          node "$GITHUB_WORKSPACE/aaw/bin/aaw.js" install \
            --framework "$GITHUB_WORKSPACE/aaw" --no-python
          node "$GITHUB_WORKSPACE/aaw/bin/aaw.js" install \
            --framework "$GITHUB_WORKSPACE/aar" --no-python

      - name: Check the installed skills resolve
        run: |
          node "$GITHUB_WORKSPACE/aar/tools/validate-skills.mjs" /tmp/ws/.agents/skills
          for s in /tmp/ws/.claude/skills/aar-*; do
            test -f "$s/SKILL.md" || { echo "::error::$s does not resolve"; exit 1; }
          done
          test -f /tmp/ws/research.yaml || { echo "::error::research.yaml was not seeded"; exit 1; }

  python:
    name: Python tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Byte-compile the tools
        run: python -m compileall -q tools

  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v6
