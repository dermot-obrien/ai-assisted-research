name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  skills:
    name: Agent Skills validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # AAR's tooling is Python; the validator is zero-dependency so this job
      # needs no install step of its own.
      - name: Validate skills against the agentskills.io spec
        run: node scripts/validate-skills.mjs skills

  install:
    name: Install into a scratch workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: aar

      # AAR installs through the shared AAW engine, so CI needs both clones.
      - uses: actions/checkout@v4
        with:
          repository: dermot-obrien/ai-assisted-work
          path: aaw

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # AAR declares `depends: [aaw]`, so AAW must be installed into the target
      # workspace first. Otherwise the dependency check warns, and a warning is a
      # non-zero exit even though the install itself succeeded. This is also the
      # order a real user installs them in.
      - name: Install AAW, then AAR
        run: |
          mkdir -p /tmp/ws/.claude && cd /tmp/ws && git init -q .
          node "$GITHUB_WORKSPACE/aaw/bin/aaw.js" install \
            --framework "$GITHUB_WORKSPACE/aaw" --no-python
          node "$GITHUB_WORKSPACE/aaw/bin/aaw.js" install \
            --framework "$GITHUB_WORKSPACE/aar" --no-python

      - name: Check the installed skills resolve
        run: |
          node "$GITHUB_WORKSPACE/aar/scripts/validate-skills.mjs" /tmp/ws/.agents/skills
          for s in /tmp/ws/.claude/skills/aar-*; do
            test -f "$s/SKILL.md" || { echo "::error::$s does not resolve"; exit 1; }
          done
          test -f /tmp/ws/research.yaml || { echo "::error::research.yaml was not seeded"; exit 1; }

  python:
    name: Python tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Byte-compile the skills' tools
        run: python -m compileall -q skills

      - name: The research-dag tools run against a scratch workspace
        run: |
          B="$GITHUB_WORKSPACE/skills/research-dag/bin"
          mkdir -p /tmp/rws/research && cd /tmp/rws
          cp "$GITHUB_WORKSPACE/skills/research-dag/assets/research.yaml.example" research.yaml
          printf 'nodes:\n- id: H-001\n  hypothesis: Root idea\n  status: framed\n  parents: []\n  target: 0.1\n  metric: accuracy\n' > research/hypothesis-dag.yaml
          python "$B/dag_update.py" --dag research/hypothesis-dag.yaml --action add --parent H-001 --hypothesis "A variant" --target 0.05
          python "$B/generate_node_index.py"
          python "$B/validate_dag_references.py"
          python "$B/generate_dashboard.py"
          python "$GITHUB_WORKSPACE/skills/aar-reconcile/scripts/reconcile.py" --dag research/hypothesis-dag.yaml --migrate

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      # The shared DAG store, end to end, against a local bare repository: seed a
      # project, write through dag_update, and read the generated view with the
      # unchanged reading tools.
      - name: The research-dag tools run against a DAG store
        env:
          RESEARCH_DAG_HOME: /tmp/dag-home
        run: |
          B="$GITHUB_WORKSPACE/skills/research-dag/bin"
          git init --quiet --bare -b main /tmp/dags.git
          printf 'nodes:\n- id: H-001\n  hypothesis: Root idea\n  status: validated\n  parent: null\n' > /tmp/seed.yaml
          mkdir -p /tmp/sws/research && cd /tmp/sws
          cp "$GITHUB_WORKSPACE/skills/research-dag/assets/research.yaml.example" research.yaml
          printf 'dag_store: "/tmp/dags.git"\ndag_project: demo\n' >> research.yaml
          python "$B/dag_store.py" import --from /tmp/seed.yaml
          python "$B/dag_store.py" view
          python "$B/dag_store.py" verify --against /tmp/seed.yaml
          python "$B/dag_update.py" --action add --parent H-001 --hypothesis "A variant" --target 0.05
          python "$B/dag_update.py" --action update --node-id H-002 --status in_progress
          grep -q "id: H-002" research/hypothesis-dag.yaml
          python "$B/generate_node_index.py"
          python "$B/validate_dag_references.py"
          python "$B/generate_dashboard.py"
          python "$B/dag_store.py" report
          python "$B/dag_store.py" prune --days 0 --dry-run
          test "$(git --git-dir=/tmp/dags.git rev-list --count main)" -ge 3

      # No network calls in CI: the literature APIs are rate-limited. Each tool must load.
      - name: The literature-discovery tools load
        run: for t in skills/literature-discovery/bin/*.py; do python "$t" --help > /dev/null; done

  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v6
