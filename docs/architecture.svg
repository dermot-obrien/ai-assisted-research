<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-label="Architecture of the hypothesis pool. Agent platforms (Claude Code, Cursor, Codex, Copilot, Jules or Devin, and a local runner on your PC in WSL2) take hypothesis nodes from the board, which the coordinator fills from the DAG store with pool.py offer. Each agent runs its node through vault.py on the node's runtime, writing capsules to the vault bucket, and records the result in the DAG store. The vault bucket holds runtimes, datasets and windows, blobs, git bundles and capsules.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a6670"/></marker>
    <marker id="v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4338ca"/></marker>
  </defs>
  <rect width="1000" height="700" fill="#ffffff"/>
  <g font-family="'Segoe UI', system-ui, -apple-system, sans-serif" fill="#1d2329">

    <!-- agents -->
    <rect x="20" y="20" width="280" height="580" rx="10" fill="#f6f7f8" stroke="#b9c2c9"/>
    <text x="36" y="46" font-size="15" font-weight="700">Agent platforms</text>
    <text x="36" y="64" font-size="11" fill="#5a6670">workers: one node each, same runtime</text>
    <g font-size="12">
      <rect x="36" y="80" width="248" height="62" rx="6" fill="#ffffff" stroke="#b9c2c9"/>
      <text x="48" y="104" font-weight="600">Claude Code (cloud)</text>
      <text x="48" y="124" font-size="11" fill="#5a6670">sessions started by pool tick</text>
      <rect x="36" y="154" width="248" height="62" rx="6" fill="#ffffff" stroke="#b9c2c9"/>
      <text x="48" y="178" font-weight="600">Cursor cloud agents</text>
      <text x="48" y="198" font-size="11" fill="#5a6670">Ubuntu VM · runtime secret for the key</text>
      <rect x="36" y="228" width="248" height="62" rx="6" fill="#ffffff" stroke="#b9c2c9"/>
      <text x="48" y="252" font-weight="600">ChatGPT Codex</text>
      <text x="48" y="272" font-size="11" fill="#5a6670">internet on, package-manager preset</text>
      <rect x="36" y="302" width="248" height="62" rx="6" fill="#ffffff" stroke="#b9c2c9"/>
      <text x="48" y="326" font-weight="600">Copilot · Jules · Devin · OpenHands</text>
      <text x="48" y="346" font-size="11" fill="#5a6670">any platform with Python, git, uv</text>
      <rect x="36" y="376" width="248" height="100" rx="6" fill="#ffffff" stroke="#1d2329" stroke-dasharray="4 3"/>
      <text x="48" y="400" font-weight="600">Your PC, in WSL2</text>
      <text x="48" y="420" font-size="11" fill="#5a6670">role runner:local-gpu · Remote Control</text>
      <text x="48" y="438" font-size="11" fill="#5a6670">GPU and large local data</text>
      <text x="48" y="456" font-size="11" fill="#5a6670">staging folder → dataset add</text>
      <rect x="36" y="488" width="248" height="96" rx="6" fill="#ffffff" stroke="#b9c2c9"/>
      <text x="48" y="512" font-weight="600">Each worker</text>
      <text x="48" y="531" font-size="11" fill="#5a6670">next --claim → pool.py check</text>
      <text x="48" y="549" font-size="11" fill="#5a6670">/research progress or campaign retest</text>
      <text x="48" y="567" font-size="11" fill="#5a6670">done "status; capsule" → bye</text>
    </g>

    <!-- board -->
    <rect x="380" y="20" width="260" height="270" rx="10" fill="#eef0fb" stroke="#4338ca" stroke-width="1.5"/>
    <text x="396" y="46" font-size="15" font-weight="700" fill="#4338ca">Board (threads store)</text>
    <text x="396" y="64" font-size="11" fill="#5a6670">the thread skill</text>
    <g font-size="12">
      <rect x="396" y="78" width="228" height="44" rx="6" fill="#ffffff" stroke="#4338ca"/>
      <text x="408" y="105" font-weight="600">coordinator:research</text>
      <rect x="396" y="132" width="228" height="44" rx="6" fill="#ffffff" stroke="#4338ca"/>
      <text x="408" y="150" font-weight="600">open calls</text>
      <text x="408" y="167" font-size="11" fill="#5a6670" font-family="Consolas, monospace">ref H-… · RT1-H-…</text>
      <rect x="396" y="186" width="228" height="44" rx="6" fill="#ffffff" stroke="#4338ca"/>
      <text x="408" y="204" font-weight="600">claims under a lease</text>
      <text x="408" y="221" font-size="11" fill="#5a6670">a lapsed claim frees the node</text>
      <rect x="396" y="240" width="228" height="40" rx="6" fill="#ffffff" stroke="#4338ca"/>
      <text x="408" y="265" font-weight="600">pool.json · beats · review</text>
    </g>

    <!-- DAG store -->
    <rect x="380" y="340" width="260" height="260" rx="10" fill="#f6f7f8" stroke="#b9c2c9"/>
    <text x="396" y="366" font-size="15" font-weight="700">DAG store</text>
    <text x="396" y="384" font-size="11" fill="#5a6670">decides what may be offered</text>
    <g font-size="12">
      <rect x="396" y="398" width="228" height="52" rx="6" fill="#ffffff" stroke="#b9c2c9"/>
      <text x="408" y="419" font-weight="600">nodes</text>
      <text x="408" y="437" font-size="11" fill="#5a6670">status · runtime · runner · parents</text>
      <rect x="396" y="460" width="228" height="52" rx="6" fill="#ffffff" stroke="#b9c2c9"/>
      <text x="408" y="481" font-weight="600">capsules[]</text>
      <text x="408" y="499" font-size="11" fill="#5a6670">where it ran · runtime matched</text>
      <rect x="396" y="522" width="228" height="62" rx="6" fill="#ffffff" stroke="#b9c2c9"/>
      <text x="408" y="543" font-weight="600">retests[]</text>
      <text x="408" y="561" font-size="11" fill="#5a6670">reproduced · rebuilt · differs</text>
      <text x="408" y="576" font-size="11" fill="#5a6670">unverifiable</text>
    </g>

    <!-- vault -->
    <rect x="720" y="20" width="260" height="580" rx="10" fill="#e7f4f2" stroke="#0f766e" stroke-width="1.5"/>
    <text x="736" y="46" font-size="15" font-weight="700" fill="#0f766e">Vault bucket</text>
    <text x="736" y="64" font-size="11" fill="#5a6670" font-family="Consolas, monospace">gs://…/vault · Autoclass</text>
    <g font-size="12">
      <rect x="736" y="80" width="228" height="80" rx="6" fill="#ffffff" stroke="#0f766e"/>
      <text x="748" y="103" font-weight="600" font-family="Consolas, monospace">runtimes/</text>
      <text x="748" y="122" font-size="11" fill="#5a6670">linux-x86_64 · Python build</text>
      <text x="748" y="139" font-size="11" fill="#5a6670">uv.lock · profile · tolerance 0</text>
      <rect x="736" y="172" width="228" height="80" rx="6" fill="#ffffff" stroke="#0f766e"/>
      <text x="748" y="195" font-weight="600" font-family="Consolas, monospace">datasets/</text>
      <text x="748" y="214" font-size="11" fill="#5a6670">versions · rules · windows</text>
      <text x="748" y="231" font-size="11" fill="#5a6670">holdout claims · used-by</text>
      <rect x="736" y="264" width="228" height="62" rx="6" fill="#ffffff" stroke="#0f766e"/>
      <text x="748" y="287" font-weight="600" font-family="Consolas, monospace">blobs/sha256/</text>
      <text x="748" y="306" font-size="11" fill="#5a6670">every file once, never replaced</text>
      <rect x="736" y="338" width="228" height="62" rx="6" fill="#ffffff" stroke="#0f766e"/>
      <text x="748" y="361" font-weight="600" font-family="Consolas, monospace">repos/</text>
      <text x="748" y="380" font-size="11" fill="#5a6670">incremental git bundles</text>
      <rect x="736" y="412" width="228" height="80" rx="6" fill="#ffffff" stroke="#0f766e"/>
      <text x="748" y="435" font-weight="600" font-family="Consolas, monospace">capsules/</text>
      <text x="748" y="454" font-size="11" fill="#5a6670">code · dataset version + window</text>
      <text x="748" y="471" font-size="11" fill="#5a6670">runtime · machine · outputs</text>
      <rect x="736" y="504" width="228" height="80" rx="6" fill="#ffffff" stroke="#0f766e"/>
      <text x="748" y="527" font-weight="600">replays</text>
      <text x="748" y="546" font-size="11" fill="#5a6670">identical at tolerance 0</text>
      <text x="748" y="563" font-size="11" fill="#5a6670">parity: another platform agrees</text>
    </g>

    <!-- arrows -->
    <g font-size="11" fill="#1d2329">
      <line x1="510" y1="340" x2="510" y2="292" stroke="#4338ca" stroke-width="1.5" marker-end="url(#b)"/>
      <text x="518" y="312">pool.py offer</text>
      <text x="518" y="326" fill="#5a6670">ready nodes only</text>

      <line x1="380" y1="150" x2="302" y2="150" stroke="#4338ca" stroke-width="1.5" marker-start="url(#b)" marker-end="url(#b)"/>
      <text x="341" y="140" text-anchor="middle">claim</text>
      <text x="341" y="168" text-anchor="middle">done</text>

      <line x1="380" y1="258" x2="302" y2="258" stroke="#4338ca" stroke-width="1.5" marker-end="url(#b)"/>
      <text x="341" y="248" text-anchor="middle">pool tick</text>
      <text x="341" y="276" text-anchor="middle">starts</text>

      <line x1="302" y1="486" x2="378" y2="486" stroke="#5a6670" stroke-width="1.3" marker-end="url(#a)"/>
      <text x="341" y="476" text-anchor="middle">sync</text>
      <text x="341" y="504" text-anchor="middle">record</text>

      <line x1="720" y1="486" x2="642" y2="486" stroke="#0f766e" stroke-width="1.5" marker-end="url(#v)"/>
      <text x="681" y="476" text-anchor="middle">capsule</text>
      <text x="681" y="504" text-anchor="middle">entry</text>

      <path d="M160,600 V640 H850 V602" fill="none" stroke="#0f766e" stroke-width="1.5" marker-end="url(#v)"/>
      <text x="505" y="660" text-anchor="middle">vault.py run on the node's runtime (checked first): capsule · replay · parity</text>
      <text x="505" y="678" text-anchor="middle" fill="#5a6670">fetches the dataset version, hash-checked; refuses an evidence run that does not match</text>
    </g>
  </g>
</svg>
